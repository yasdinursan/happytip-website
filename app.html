<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<title>HappyTip App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#080a0f;color:#f5f7fb;font-family:Arial,sans-serif}
body{min-height:100vh;padding-bottom:90px}
.container{max-width:600px;margin:auto;padding:18px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.logo{font-size:25px;font-weight:800}
.logo span{color:#20d6a3}
.user{font-size:13px;color:#8f98a8}
.balance{
background:linear-gradient(145deg,#151922,#0e1118);
border:1px solid #252b38;border-radius:20px;padding:22px;margin-bottom:16px
}
.label{font-size:13px;color:#8f98a8}
.amount{font-size:32px;font-weight:800;margin-top:7px}
.symbol{color:#20d6a3}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{
background:#11141b;border:1px solid #222936;border-radius:16px;
padding:18px 14px;min-height:100px;text-align:left;color:#fff;
font-size:15px;font-weight:700
}
.card small{display:block;color:#858e9f;font-size:12px;font-weight:400;margin-top:7px}
.icon{font-size:25px;margin-bottom:10px}
.section{font-size:16px;font-weight:800;margin:25px 0 12px}
.power{
background:linear-gradient(145deg,#151922,#0d1016);
border:1px solid #252b38;border-radius:18px;padding:18px
}
.power-row{display:flex;justify-content:space-between;padding:8px 0;color:#aeb6c5;font-size:13px}
.power-row b{color:#fff}
.nav{
position:fixed;bottom:0;left:0;right:0;background:#0c0f15;
border-top:1px solid #202631;padding:10px 14px;
display:flex;justify-content:space-around;z-index:10
}
.nav button{background:none;border:0;color:#7f8999;font-size:11px}
.nav button.active{color:#20d6a3}
.nav-icon{font-size:20px;display:block;margin-bottom:3px}
button{font-family:inherit}
</style>

<style>
.profile-page{
  padding-bottom:25px;
}

.profile-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.profile-title{
  font-size:18px;
  font-weight:800;
}

.profile-btn{
  width:38px;
  height:38px;
  border-radius:12px;
  border:1px solid #252b38;
  background:#11151d;
  color:#fff;
  font-size:24px;
}

.profile-btn.refresh{
  color:#20d6a3;
  font-size:20px;
}

.profile-hero{
  text-align:center;
  padding:28px 18px 23px;
  border-radius:23px;
  border:1px solid #252b38;
  background:
    radial-gradient(circle at 50% -10%,rgba(32,214,163,.18),transparent 48%),
    linear-gradient(145deg,#151922,#0c1016);
}

.profile-avatar{
  width:70px;
  height:70px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:21px;
  background:linear-gradient(145deg,#20d6a3,#0c9c78);
  color:#06120f;
  font-size:28px;
  font-weight:900;
  box-shadow:0 10px 30px rgba(32,214,163,.14);
}

.profile-name{
  margin-top:14px;
  font-size:21px;
  font-weight:900;
}

.profile-member{
  margin-top:5px;
  color:#8995a5;
  font-size:12px;
}

.profile-level{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:15px;
  padding:7px 13px;
  border-radius:999px;
  background:#101b18;
  border:1px solid #245044;
  color:#9cebd4;
  font-size:12px;
}

.profile-level b{
  color:#fff;
}

.profile-xp{
  margin-top:13px;
  padding:19px;
  border-radius:20px;
  border:1px solid #252b38;
  background:#11151d;
}

.xp-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.xp-label{
  color:#8995a5;
  font-size:10px;
  font-weight:800;
  letter-spacing:1.3px;
}

.xp-number{
  margin-top:4px;
  font-size:28px;
  font-weight:900;
}

.xp-symbol{
  font-size:28px;
}

.xp-track{
  height:8px;
  margin-top:17px;
  overflow:hidden;
  border-radius:20px;
  background:#202631;
}

.xp-progress{
  width:8%;
  height:100%;
  border-radius:20px;
  background:#20d6a3;
}

.xp-bottom{
  display:flex;
  justify-content:space-between;
  margin-top:9px;
  color:#8995a5;
  font-size:11px;
}

.xp-bottom b{
  color:#fff;
}

.profile-section-title{
  margin:24px 2px 11px;
  font-size:15px;
  font-weight:800;
}

.profile-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.profile-stat{
  padding:16px;
  border-radius:17px;
  border:1px solid #222936;
  background:#11141b;
}

.stat-icon{
  font-size:21px;
  margin-bottom:10px;
}

.stat-number{
  font-size:20px;
  font-weight:900;
}

.stat-name{
  margin-top:4px;
  color:#8995a5;
  font-size:11px;
}

.profile-info{
  padding:3px 16px;
  border-radius:18px;
  border:1px solid #222936;
  background:#11141b;
}

.info-item{
  display:flex;
  align-items:center;
  gap:11px;
  padding:15px 0;
}

.info-icon{
  width:34px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  background:#171c25;
  font-size:16px;
}

.info-content{
  flex:1;
}

.info-content b{
  display:block;
  font-size:12px;
}

.info-content span{
  display:block;
  margin-top:4px;
  color:#788394;
  font-size:10px;
}

.info-item strong{
  color:#20d6a3;
  font-size:12px;
  white-space:nowrap;
}

.info-line{
  height:1px;
  background:#202631;
}

.profile-note{
  display:flex;
  gap:11px;
  margin-top:14px;
  padding:15px;
  border-radius:17px;
  border:1px solid #1c3830;
  background:#0e1715;
}

.note-icon{
  font-size:19px;
}

.profile-note b{
  font-size:12px;
}

.profile-note p{
  margin:5px 0 0;
  color:#8995a5;
  font-size:10px;
  line-height:1.5;
}
</style>

<style>
.profile-page{padding-bottom:30px}

.profile-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px
}

.page-title{font-size:18px;font-weight:800}

.back-btn,.refresh-btn{
  width:38px;height:38px;border-radius:12px;
  border:1px solid #252b38;
  background:#11151d;color:#fff;
  font-size:22px
}

.refresh-btn{color:#20d6a3;font-size:20px}

.profile-hero{
  background:
    radial-gradient(circle at 50% 0%,rgba(32,214,163,.16),transparent 48%),
    linear-gradient(145deg,#151922,#0d1016);
  border:1px solid #252b38;
  border-radius:22px;
  padding:28px 20px 22px;
  text-align:center;
  overflow:hidden
}

.avatar{
  width:68px;height:68px;
  margin:0 auto 13px;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(145deg,#20d6a3,#0d9d78);
  color:#06120f;
  font-size:27px;
  font-weight:900
}

.profile-name{font-size:21px;font-weight:800}

.profile-subtitle{
  color:#8995a5;
  font-size:13px;
  margin-top:5px
}

.level-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:14px;
  padding:7px 12px;
  border-radius:999px;
  background:#101a18;
  border:1px solid #21463c;
  color:#9cebd4;
  font-size:12px
}

.xp-card{
  margin-top:14px;
  padding:18px;
  border-radius:20px;
  background:#11151d;
  border:1px solid #252b38
}

.xp-header{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.card-label{
  color:#8995a5;
  font-size:10px;
  font-weight:800;
  letter-spacing:1.2px
}

.xp-value{
  font-size:28px;
  font-weight:900;
  margin-top:4px
}

.xp-icon{font-size:28px}

.xp-bar{
  height:8px;
  background:#202631;
  border-radius:20px;
  overflow:hidden;
  margin-top:17px
}

.xp-fill{
  width:0%;
  height:100%;
  background:#20d6a3;
  border-radius:20px;
  transition:width .5s ease
}

.xp-footer{
  display:flex;
  justify-content:space-between;
  margin-top:9px;
  color:#8995a5;
  font-size:11px
}

.xp-footer b{color:#fff}

.section-title{
  font-size:15px;
  font-weight:800;
  margin:24px 2px 11px
}

.profile-stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.stat-card{
  background:#11141b;
  border:1px solid #222936;
  border-radius:17px;
  padding:16px
}

.stat-icon{font-size:20px;margin-bottom:11px}

.stat-value{font-size:20px;font-weight:900}

.stat-label{
  color:#8995a5;
  font-size:11px;
  margin-top:4px
}

.info-card{
  background:#11141b;
  border:1px solid #222936;
  border-radius:18px;
  padding:5px 16px
}

.info-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  padding:15px 0
}

.info-title{font-size:13px;font-weight:700}

.info-desc{
  color:#788394;
  font-size:10px;
  margin-top:4px
}

.info-row>b{
  color:#20d6a3;
  font-size:13px;
  white-space:nowrap
}

.divider{height:1px;background:#202631}

.profile-note{
  display:flex;
  gap:11px;
  margin-top:14px;
  padding:15px;
  border-radius:16px;
  background:#0e1715;
  border:1px solid #1c3830
}

.profile-note>span{font-size:18px}

.profile-note b{font-size:12px}

.profile-note p{
  color:#8995a5;
  font-size:10px;
  line-height:1.5;
  margin:5px 0 0
}
.profile-avatar-fix{}

.avatar.has-photo{
  overflow:hidden;
  padding:0;
}

.avatar.has-photo img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  border-radius:inherit;
}\n</style>
</head>

<body>
<div class="container">

<div class="header">
  <div class="logo">Happy<span>Tip</span></div>
  <div class="user" id="username">Guest</div>
</div>

<div class="balance">
  <div class="label">My HTP Balance</div>
  <div class="amount">0 <span class="symbol">HTP</span></div>
  <div class="label" style="margin-top:8px">Wallet balance</div>
</div>

<div class="section">Quick Actions</div>

<div class="grid">
  <button class="card" onclick="openFeature('wallet')">
    <div class="icon">👛</div>
    Wallet
    <small>Manage your wallet</small>
  </button>

  <button class="card" onclick="openFeature('tip')">
    <div class="icon">🎁</div>
    Send Tip
    <small>Reward someone</small>
  </button>

  <button class="card" onclick="openFeature('deposit')">
    <div class="icon">📥</div>
    Deposit
    <small>Deposit HTP</small>
  </button>

  <button class="card" onclick="openFeature('withdraw')">
    <div class="icon">💸</div>
    Withdraw
    <small>Withdraw HTP</small>
  </button>
</div>

<div class="section">HappyTip</div>

<div class="grid">
  <button class="card" onclick="openFeature('missions')">
    <div class="icon">🎯</div>
    Missions
    <small>Complete missions</small>
  </button>

  <button class="card" onclick="openFeature('giveaway')">
    <div class="icon">🎁</div>
    Giveaway
    <small>Join active giveaways</small>
  </button>

  <button class="card" onclick="openFeature('profile')">
    <div class="icon">👤</div>
    My Profile
    <small>View your profile</small>
  </button>

  <button class="card" onclick="openFeature('referral')">
    <div class="icon">👥</div>
    Referral
    <small>Invite friends</small>
  </button>
</div>

<div class="section">Giveaway Power</div>

<div class="power">
  <div class="power-row"><span>🔒 HTP Lock Power</span><b>0 / 20</b></div>
  <div class="power-row"><span>⭐ Level Power</span><b>0 / 5</b></div>
  <div class="power-row"><span>⚡ Activity Power</span><b>0 / 5</b></div>
  <div class="power-row"><span>🔥 Streak Power</span><b>0 / 10</b></div>
  <div class="power-row"><span>🌍 Community Power</span><b>0 / 10</b></div>
  <hr style="border:0;border-top:1px solid #252b38">
  <div class="power-row"><span>⚡ Core Power</span><b>0 / 50</b></div>
  <div class="power-row"><span>🎟️ Final Power</span><b>0</b></div>
</div>

</div>

<div class="nav">
  <button class="active" onclick="scrollTo(0,0)">
    <span class="nav-icon">🏠</span>Home
  </button>
  <button onclick="openFeature('wallet')">
    <span class="nav-icon">👛</span>Wallet
  </button>
  <button onclick="openFeature('giveaway')">
    <span class="nav-icon">🎁</span>Giveaway
  </button>
  <button onclick="openFeature('profile')">
    <span class="nav-icon">👤</span>Profile
  </button>
</div>

<script>
const tg=window.Telegram?.WebApp;

if(tg){
  tg.ready();
  tg.expand();

  const user=tg.initDataUnsafe?.user;
  if(user){
    document.getElementById("username").textContent=
      user.username ? "@"+user.username : (user.first_name||"User");
  }
}

function openFeature(feature){
  if(tg) tg.HapticFeedback?.impactOccurred("light");

  if(feature === "profile"){
    showProfile();
    return;
  }

  alert(feature.charAt(0).toUpperCase()+feature.slice(1)+" — coming next");
}

async function showProfile(){
  if(tg) tg.HapticFeedback?.impactOccurred("light");

  const user=tg?.initDataUnsafe?.user || {};
  const name=user.username ? "@"+user.username : (user.first_name || "HappyTip User");
  const firstName=user.first_name || "U";
  const userId=user.id;

  console.log("HAPPYTIP MINI APP USER:", user);
  console.log("HAPPYTIP MINI APP USER ID:", userId);

  document.querySelector(".container").innerHTML=`
    <div class="profile-page">

      <div class="profile-top">
        <button class="back-btn" onclick="location.reload()">‹</button>
        <div class="page-title">My Profile</div>
        <button class="refresh-btn" onclick="showProfile()">↻</button>
      </div>

      <div class="profile-hero">
        <div class="avatar" id="profile-avatar">${firstName.charAt(0).toUpperCase()}</div>
        <div class="profile-name">${name}</div>
        <div class="profile-subtitle">HappyTip Member</div>

        <div class="level-badge">
          ⭐ Level <b id="profile-level">Loading...</b>
        </div>
      </div>

      <div class="xp-card">
        <div class="xp-header">
          <div>
            <div class="card-label">TOTAL XP</div>
            <div class="xp-value" id="profile-xp">Loading...</div>
          </div>
          <div class="xp-icon">✨</div>
        </div>

        <div class="xp-bar">
          <div class="xp-fill" id="profile-xp-fill"></div>
        </div>

        <div class="xp-footer">
          <span>Level Progress</span>
          <b id="profile-progress">Loading...</b>
        </div>
      </div>

      <div class="section-title">Profile Statistics</div>

      <div class="profile-stats">

        <div class="stat-card">
          <div class="stat-icon">🎯</div>
          <div class="stat-value" id="profile-events">—</div>
          <div class="stat-label">XP Events</div>
        </div>

        <div class="stat-card">
          <div class="stat-icon">👥</div>
          <div class="stat-value" id="profile-referrals">—</div>
          <div class="stat-label">Referrals</div>
        </div>

        <div class="stat-card">
          <div class="stat-icon">🏆</div>
          <div class="stat-value" id="profile-missions">—</div>
          <div class="stat-label">Missions</div>
        </div>

        <div class="stat-card">
          <div class="stat-icon">⚡</div>
          <div class="stat-value">AP</div>
          <div class="stat-label">Activity Points</div>
        </div>

      </div>

      <div class="section-title">Progression</div>

      <div class="info-card">

        <div class="info-row">
          <div>
            <div class="info-title">⭐ HappyTip Level</div>
            <div class="info-desc">Permanent ecosystem progression</div>
          </div>
          <b id="info-level">—</b>
        </div>

        <div class="divider"></div>

        <div class="info-row">
          <div>
            <div class="info-title">✨ XP Progress</div>
            <div class="info-desc">Earn XP through valid activity</div>
          </div>
          <b id="info-xp">—</b>
        </div>

        <div class="divider"></div>

        <div class="info-row">
          <div>
            <div class="info-title">⚡ Activity Points</div>
            <div class="info-desc">Separate from XP and Level</div>
          </div>
          <b>AP</b>
        </div>

      </div>

      <div class="profile-note">
        <span>💡</span>
        <div>
          <b>Your progression matters</b>
          <p>XP adalah progression permanen kamu. Activity Points (AP) dihitung terpisah.</p>
        </div>
      </div>

    </div>
  `;

  document.querySelector(".nav").style.display="none";

  if(!userId){
    document.getElementById("profile-level").textContent="Unavailable";
    return;
  }

  try{
    const API="https://polymer-denied-trips-barrel.trycloudflare.com/api/profile";
    const response=await fetch(API+"?user_id="+encodeURIComponent(userId));

    if(!response.ok) throw new Error("API HTTP "+response.status);

    const data=await response.json();

    if(!data.ok || !data.profile){
      throw new Error(data.error || "Profile unavailable");
    }

    const p=data.profile;

    // Telegram profile photo
    if(p.photo_url){
      const avatar=document.getElementById("profile-avatar");
      avatar.innerHTML=`<img src="${p.photo_url}" alt="Profile Photo">`;
      avatar.classList.add("has-photo");
    }

    document.getElementById("profile-level").textContent=p.level;
    document.getElementById("profile-xp").textContent=p.xp+" XP";
    document.getElementById("profile-progress").textContent=p.xp_progress;
    document.getElementById("profile-xp-fill").style.width=(p.progress_percent || 0)+"%";

    document.getElementById("profile-events").textContent=p.xp_events;
    document.getElementById("profile-referrals").textContent=p.referrals;
    document.getElementById("profile-missions").textContent=p.missions_completed;

    document.getElementById("info-level").textContent="Level "+p.level;
    document.getElementById("info-xp").textContent=p.xp_progress;

  }catch(error){
    console.error("Mini App Profile API:",error);

    document.getElementById("profile-level").textContent="—";
    document.getElementById("profile-xp").textContent="Unavailable";
    document.getElementById("profile-progress").textContent="Unable to load";
  }
}
</script>

</body>
</html>
