<style>
*{box-sizing:border-box}
html,body{margin:0;background:#080a0f;color:#f5f7fb;font-family:Arial,sans-serif}
body{min-height:100vh;padding-bottom:90px}

<style id="happytip-professional-ui">
/* === HAPPYTIP PROFESSIONAL UI V2 === */

:root{
  --htp-bg:#080b10;
  --htp-surface:#0e131a;
  --htp-surface2:#121820;
  --htp-border:rgba(255,255,255,.075);
  --htp-text:#f3f6f8;
  --htp-muted:#89939f;
  --htp-green:#35d07f;
  --htp-green-soft:rgba(53,208,127,.10);
  --htp-blue:#4da3ff;
  --htp-yellow:#f4c95d;
  --htp-red:#ff6678;
  --htp-radius:18px;
}

/* Global */
html{
  background:var(--htp-bg)!important;
  scroll-behavior:smooth;
}

body{
  background:
    radial-gradient(circle at 50% -10%,rgba(53,208,127,.055),transparent 35%),
    var(--htp-bg)!important;
  color:var(--htp-text)!important;
  -webkit-font-smoothing:antialiased;
}

.container{
  max-width:560px!important;
  margin:auto!important;
  padding-bottom:90px!important;
}

/* Jangan semua hijau */
.info-card,
.stat-card,
.profile-card,
.card{
  background:linear-gradient(145deg,var(--htp-surface),var(--htp-surface2))!important;
  border:1px solid var(--htp-border)!important;
  border-radius:var(--htp-radius)!important;
  box-shadow:0 8px 28px rgba(0,0,0,.16)!important;
}

/* Card spacing */
.info-card{
  margin:12px 0!important;
  padding:17px!important;
}

.stat-card{
  padding:16px!important;
  transition:transform .18s ease,border-color .18s ease;
}

.stat-card:active{
  transform:scale(.985);
}

/* Titles */
.info-title{
  color:var(--htp-text)!important;
  font-size:14px!important;
  font-weight:750!important;
  letter-spacing:.1px;
}

.info-desc,
.profile-subtitle{
  color:var(--htp-muted)!important;
}

/* Profile */
.profile-page{
  animation:htpPageIn .18s ease-out!important;
}

.profile-top{
  min-height:52px!important;
}

.page-title{
  font-size:17px!important;
  font-weight:800!important;
}

.profile-hero{
  background:
    radial-gradient(circle at 50% 0%,rgba(53,208,127,.10),transparent 55%),
    transparent!important;
  border:0!important;
  box-shadow:none!important;
  padding:22px 12px 18px!important;
}

.profile-name{
  font-size:22px!important;
  font-weight:850!important;
}

.avatar{
  width:58px!important;
  height:58px!important;
  border-radius:18px!important;
  background:var(--htp-green-soft)!important;
  border:1px solid rgba(53,208,127,.18)!important;
}

/* Wallet balance */
#wallet-eth,
#wallet-htp{
  font-size:20px!important;
  font-weight:850!important;
}

#wallet-htp{
  color:var(--htp-green)!important;
}

#wallet-eth{
  color:#dce7f0!important;
}

/* Buttons — tidak semuanya hijau */
.primary-btn{
  min-height:46px!important;
  border-radius:13px!important;
  border:1px solid rgba(53,208,127,.28)!important;
  background:var(--htp-green-soft)!important;
  color:#eafff2!important;
  font-weight:750!important;
  box-shadow:none!important;
  transition:transform .16s ease,background .16s ease!important;
}

.primary-btn:active{
  transform:scale(.975)!important;
}

.secondary-btn{
  background:rgba(255,255,255,.045)!important;
  border:1px solid var(--htp-border)!important;
}

/* Back / refresh */
.back-btn,
.refresh-btn{
  background:rgba(255,255,255,.045)!important;
  border:1px solid var(--htp-border)!important;
  color:#dce3e8!important;
  border-radius:12px!important;
}

/* Inputs */
.input,
input,
textarea,
select{
  background:#0a0e14!important;
  color:var(--htp-text)!important;
  border:1px solid var(--htp-border)!important;
  border-radius:13px!important;
  min-height:46px;
  outline:none!important;
}

.input:focus,
input:focus,
textarea:focus,
select:focus{
  border-color:rgba(53,208,127,.42)!important;
  box-shadow:0 0 0 3px rgba(53,208,127,.07)!important;
}

/* Address */
.ref-link{
  background:#090d12!important;
  border:1px solid var(--htp-border)!important;
  border-radius:12px!important;
  color:#aeb8c2!important;
}

/* Rows */
.info-row,
.power-row{
  border-bottom:1px solid rgba(255,255,255,.045)!important;
  padding:11px 0!important;
}

.info-row:last-child,
.power-row:last-child{
  border-bottom:0!important;
}

/* Navigation */
.nav{
  background:rgba(9,12,17,.92)!important;
  backdrop-filter:blur(18px)!important;
  -webkit-backdrop-filter:blur(18px)!important;
  border-top:1px solid rgba(255,255,255,.07)!important;
  box-shadow:0 -10px 30px rgba(0,0,0,.22)!important;
}

.nav button{
  color:#727d88!important;
  transition:color .18s ease,transform .18s ease!important;
}

.nav button.active{
  color:var(--htp-green)!important;
}

.nav button:active{
  transform:translateY(1px);
}

/* Transaction history */
#transaction-history{
  margin-top:4px;
}

#transaction-history > div{
  transition:background .15s ease;
}

#transaction-history > div:active{
  background:rgba(255,255,255,.025);
}

/* Hide ugly default horizontal rules */
.info-card hr{
  border-color:rgba(255,255,255,.06)!important;
}

/* Loading / skeleton */
.htp-skeleton{
  position:relative;
  overflow:hidden;
  background:#151b23!important;
  border-radius:10px;
  color:transparent!important;
}

.htp-skeleton:after{
  content:"";
  position:absolute;
  inset:0;
  transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.055),transparent);
  animation:htpShimmer 1.15s infinite;
}

@keyframes htpShimmer{
  100%{transform:translateX(100%)}
}

@keyframes htpPageIn{
  from{opacity:0;transform:translateY(4px)}
  to{opacity:1;transform:translateY(0)}
}

/* Prevent giant blank loading areas */
.loading,
.loader,
.spinner{
  margin:14px auto!important;
}

/* Mobile */
@media(max-width:600px){
  .container{
    width:100%!important;
    padding-left:12px!important;
    padding-right:12px!important;
  }

  .profile-page{
    padding-left:0!important;
    padding-right:0!important;
  }

  .info-card{
    padding:15px!important;
    margin:10px 0!important;
  }

  .profile-stats{
    gap:9px!important;
  }

  .stat-card{
    min-width:0!important;
  }
}

/* Respect reduced motion */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
}
</style>


<style id="happytip-fast-loading">
/* === HAPPYTIP FAST LOADING V1 === */

.htp-loading{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  padding:18px 8px;
  color:#89939f;
  font-size:13px;
}

.htp-loading-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#35d07f;
  animation:htpPulse .85s infinite ease-in-out;
}

.htp-loading-dot:nth-child(2){animation-delay:.12s}
.htp-loading-dot:nth-child(3){animation-delay:.24s}

@keyframes htpPulse{
  0%,100%{opacity:.25;transform:scale(.75)}
  50%{opacity:1;transform:scale(1)}
}

/* Instant visual feedback when navigating */
.profile-page,
.container > *{
  animation:htpInstantIn .16s ease-out;
}

@keyframes htpInstantIn{
  from{opacity:.45;transform:translateY(3px)}
  to{opacity:1;transform:translateY(0)}
}

/* Disable browser tap delay */
button,a,input{
  touch-action:manipulation;
}

/* Prevent flash of invisible content */
.container{
  opacity:1!important;
}

/* Lightweight skeleton blocks */
.htp-skeleton-line{
  height:13px;
  width:100%;
  border-radius:7px;
  background:#151b23;
  position:relative;
  overflow:hidden;
}

.htp-skeleton-line.small{width:42%}
.htp-skeleton-line.medium{width:68%}

.htp-skeleton-line:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.055),
    transparent
  );
  transform:translateX(-100%);
  animation:htpSkeletonMove 1.1s infinite;
}

@keyframes htpSkeletonMove{
  to{transform:translateX(100%)}
}
</style>

async function showWithdraw(){
  if(tg) tg.HapticFeedback?.impactOccurred("light");

  const user=tg?.initDataUnsafe?.user || {};
  const userId=user.id;

  document.querySelector(".container").innerHTML=`
    <div class="profile-page">

      <div class="profile-top">
        <button class="back-btn" onclick="showWallet()">‹</button>
        <div class="page-title">Withdraw</div>
        <button class="refresh-btn" onclick="showWithdraw()">↻</button>
      </div>

      <div class="profile-hero">
        <div class="avatar">💸</div>
        <div class="profile-name">Withdraw HTP</div>
        <div class="profile-subtitle">Withdraw your earned HTP</div>
      </div>

      <div class="info-card">
        <div class="info-title">🟢 Available HTP</div>
        <div class="stat-value" id="withdraw-balance">Loading...</div>
        <div class="info-desc">
          Only your available internal HTP reward balance can be withdrawn.
        </div>
      </div>

      <div class="info-card">
        <div class="info-title">👛 Destination Wallet</div>

        <input
          id="withdraw-address"
          class="input"
          type="text"
          placeholder="0x..."
          autocomplete="off"
          spellcheck="false"
        />

        <div style="height:12px"></div>

        <div class="info-title">💰 Amount</div>

        <input
          id="withdraw-amount"
          class="input"
          type="number"
          min="0"
          step="any"
          placeholder="Amount HTP"
          inputmode="decimal"
        />

        <div style="height:14px"></div>

        <button
          class="primary-btn"
          id="withdraw-submit"
          onclick="submitWithdraw()"
        >
          💸 Withdraw HTP
        </button>
      </div>

      <div class="info-card">
        <div class="info-title">🌐 Network</div>

        <div class="info-row">
          <span>Network</span>
          <b>Ethereum Sepolia</b>
        </div>

        <div class="info-row">
          <span>Asset</span>
          <b>HTP</b>
        </div>
      </div>

      <div class="info-card">
        <div class="info-title">⚠️ Important</div>
        <p>
          Make sure the destination address is correct.
          HTP withdrawals are sent from the HappyTip Treasury
          on Ethereum Sepolia.
        </p>
      </div>

    </div>
  `;

  if(!userId){
    document.getElementById("withdraw-balance").textContent="Unavailable";
    return;
  }

  try{
    const API="https://polymer-denied-trips-barrel.trycloudflare.com/api/wallet";

    const response=await fetch(
      API,
      {
        headers:{
          "X-Telegram-Init-Data":tg?.initData || ""
        }
      }
    );

    if(!response.ok){
      throw new Error("API HTTP "+response.status);
    }

    const data=await response.json();

    if(!data.ok || !data.wallet){
      throw new Error(data.error || "Wallet unavailable");
    }

    /*
     * Withdrawal balance is the user's internal claimed_reward.
     * It is NOT the on-chain wallet HTP balance.
     *
     * The withdraw backend is the final authority and validates
     * claimed_reward again before broadcasting the treasury TX.
     */
    const withdrawBalance =
      data.wallet.claimed_reward ??
      data.wallet.internal_balance ??
      0;

    document.getElementById("withdraw-balance").textContent =
      Number(withdrawBalance).toLocaleString("en-US") + " HTP";

  }catch(error){
    console.error("Mini App Withdraw Balance API:",error);
    document.getElementById("withdraw-balance").textContent="Unavailable";
  }
}


async function submitWithdraw(){

  if(tg) tg.HapticFeedback?.impactOccurred("medium");

  const initData=tg?.initData || "";

  if(!initData){
    alert("❌ Telegram authentication unavailable.");
    return;
  }

  const address=document.getElementById("withdraw-address")?.value.trim();
  const amount=document.getElementById("withdraw-amount")?.value.trim();
  const button=document.getElementById("withdraw-submit");

  if(!address){
    alert("❌ Enter the destination wallet address.");
    return;
  }

  if(!/^0x[a-fA-F0-9]{40}$/.test(address)){
    alert("❌ Invalid Ethereum wallet address.");
    return;
  }

  if(!amount){
    alert("❌ Enter the withdrawal amount.");
    return;
  }

  const numericAmount=Number(amount);

  if(!Number.isFinite(numericAmount) || numericAmount<=0){
    alert("❌ Amount must be greater than 0.");
    return;
  }

  button.disabled=true;
  button.textContent="⏳ Processing...";

  try{

    const API="https://polymer-denied-trips-barrel.trycloudflare.com/api/withdraw";

    const response=await fetch(API,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "X-Telegram-Init-Data":initData
      },
      body:JSON.stringify({
        asset:"htp",
        network:"sepolia",
        address:address,
        amount:amount
      })
    });

    const data=await response.json();

    if(data.ok){

      if(tg) tg.HapticFeedback?.notificationOccurred("success");

      document.querySelector(".container").innerHTML=`
        <div class="profile-page">

          <div class="profile-top">
            <button class="back-btn" onclick="showWallet()">‹</button>
            <div class="page-title">Withdraw</div>
          </div>

          <div class="profile-hero">
            <div class="avatar">✅</div>
            <div class="profile-name">Withdrawal Sent</div>
            <div class="profile-subtitle">HTP withdrawal completed</div>
          </div>

          <div class="info-card">
            <div class="info-title">💰 Amount</div>
            <div class="stat-value">${data.amount} HTP</div>
          </div>

          <div class="info-card">
            <div class="info-title">👛 Destination</div>
            <div class="ref-link">${address}</div>
          </div>

          <div class="info-card">
            <div class="info-title">🔗 Transaction</div>
            <div class="ref-link">${data.tx_hash}</div>

            <button
              class="primary-btn"
              onclick="window.open('${data.explorer}','_blank')"
            >
              🔗 View on Etherscan
            </button>
          </div>

          <button class="primary-btn" onclick="showWallet()">
            👛 Back to Wallet
          </button>

        </div>
      `;

      return;
    }

    if(data.pending){

      if(tg) tg.HapticFeedback?.notificationOccurred("warning");

      document.querySelector(".container").innerHTML=`
        <div class="profile-page">

          <div class="profile-top">
            <button class="back-btn" onclick="showWallet()">‹</button>
            <div class="page-title">Withdraw</div>
          </div>

          <div class="profile-hero">
            <div class="avatar">⏳</div>
            <div class="profile-name">Transaction Pending</div>
            <div class="profile-subtitle">Waiting for blockchain confirmation</div>
          </div>

          <div class="info-card">
            <div class="info-title">💰 Amount</div>
            <div class="stat-value">${data.amount} ${data.asset}</div>
          </div>

          <div class="info-card">
            <div class="info-title">🔗 Transaction</div>
            <div class="ref-link">${data.tx_hash}</div>

            <button
              class="primary-btn"
              onclick="window.open('${data.explorer}','_blank')"
            >
              🔗 View Transaction
            </button>
          </div>

          <div class="info-card">
            <p>
              The transaction has already been broadcast.
              Your internal balance will only be deducted after
              successful on-chain confirmation.
            </p>
          </div>

        </div>
      `;

      return;
    }

    throw new Error(data.error || "Withdrawal failed.");

  }catch(error){

    console.error("Mini App Withdraw:",error);

    if(tg) tg.HapticFeedback?.notificationOccurred("error");

    alert(
      "❌ WITHDRAW FAILED\n\n"+
      (error.message || "Unknown error")
    );

    button.disabled=false;
    button.textContent="💸 Withdraw HTP";
  }
}



const tg=window.Telegram?.WebApp;

if(tg){
  tg.ready();
  tg.expand();

    document.getElementById("username").textContent=

// Initial Mini App render

  document.addEventListener("DOMContentLoaded", ()=>showHome(), {once:true});
}else{
  showHome();
}


function openFeature(feature){
  if(tg) tg.HapticFeedback?.impactOccurred("light");

  if(feature === "profile"){
    showProfile();
    return;
  }

  if(feature === "referral"){
    showReferral();
    return;
  }

  if(feature === "wallet"){
    showWallet();
    return;
  }

  if(feature === "deposit"){
    showDeposit();
    return;
  }

  if(feature === "withdraw"){
    showWithdraw();
    return;
  }

  if(feature === "giveaway"){
    showGiveaway();
    return;
  }

  alert(feature.charAt(0).toUpperCase()+feature.slice(1)+" — coming next");
}


function openGiveawayTelegram(chatId,messageId){
  if(!chatId || !messageId){
    alert("❌ Giveaway message unavailable.");
    return;
  }

  const id=String(chatId);
  const mid=String(messageId);

  if(!id.startsWith("-100")){
    alert("❌ Giveaway message link unavailable.");
    return;
  }

  const link="https://t.me/c/"+id.slice(4)+"/"+mid;

  if(tg?.openTelegramLink){
    tg.openTelegramLink(link);
  }else{
    window.open(link,"_blank");
  }
}

async function showDeposit(){
  if(tg) tg.HapticFeedback?.impactOccurred("light");

  const user=tg?.initDataUnsafe?.user || {};
  const userId=user.id;

  document.querySelector(".container").innerHTML=`
    <div class="profile-page">

      <div class="profile-top">
        <button class="back-btn" onclick="showWallet()">‹</button>
        <div class="page-title">Deposit</div>
        <button class="refresh-btn" onclick="showDeposit()">↻</button>
      </div>

        <div class="profile-name">Deposit</div>
        <div class="profile-subtitle">Deposit ETH or HTP</div>
      </div>

      <div class="info-card">
        <div class="info-title">👛 Your Wallet Address</div>

        <div class="ref-link" id="deposit-address">
          Loading...
        </div>

        <button class="primary-btn" onclick="copyDepositAddress()">
          📋 Copy Address
        </button>
      </div>

      <div class="info-card">
        <div class="info-title">🌐 Network</div>

        <div class="info-row">
          <span>Network</span>
          <b>Ethereum Sepolia</b>
        </div>

        <div class="info-row">
          <span>Supported Assets</span>
          <b>ETH / HTP</b>
        </div>
      </div>

      <div class="info-card">
        <div class="info-title">⚠️ Important</div>
        <p>
          Only send ETH or HTP on Ethereum Sepolia.
          Do not send Mainnet assets to this address.
        </p>
      </div>

      <div class="info-card">
        <div class="info-title">💡 How Deposit Works</div>
        <p>
          Send ETH or HTP to the wallet address above.
          HTP deposits are automatically detected and processed by HappyTip.
        </p>
      </div>

    </div>
  `;

  if(!userId){
    document.getElementById("deposit-address").textContent="Unavailable";
    return;
  }

  try{
    const API="https://polymer-denied-trips-barrel.trycloudflare.com/api/wallet";
    const response=await fetch(
      API+"?user_id="+encodeURIComponent(userId)
    );

    if(!response.ok){
      throw new Error("API HTTP "+response.status);
    }

    const data=await response.json();

    if(!data.ok || !data.wallet){
      throw new Error(data.error || "Wallet unavailable");
    }

    const address=data.wallet.address;

    document.getElementById("deposit-address").textContent=address;
    window.happyTipDepositAddress=address;

  }catch(error){
    console.error("Mini App Deposit API:",error);
    document.getElementById("deposit-address").textContent="Unable to load";
  }
}

async function copyDepositAddress(){
  const address=window.happyTipDepositAddress;
  if(!address) return;

  try{
    await navigator.clipboard.writeText(address);
  }catch(e){
    const input=document.createElement("input");
    input.value=address;
    document.body.appendChild(input);
    input.select();
    document.execCommand("copy");
    input.remove();
  }

  if(tg){
    tg.HapticFeedback?.notificationOccurred("success");
  }
}

async function loadTransactionHistory(userId){
  const box=document.getElementById("transaction-history");
  if(!box) return;

  if(!userId){
    box.innerHTML='<div class="info-desc">Transaction history unavailable.</div>';
    return;
  }

  try{
    const API="https://polymer-denied-trips-barrel.trycloudflare.com/api/transactions";
    const response=await fetch(
      API+"?user_id="+encodeURIComponent(userId)
    );

    if(!response.ok){
      throw new Error("API HTTP "+response.status);
    }

    const data=await response.json();

    if(!data.ok){
      throw new Error(data.error || "Transaction history unavailable");
    }

    const transactions=Array.isArray(data.transactions)
      ? data.transactions
      : [];

    if(!transactions.length){
      box.innerHTML=`
        <div class="info-desc" style="text-align:center;padding:14px 0;">
          No transactions yet.
        </div>
      `;
      return;
    }

    const typeInfo={
      DEPOSIT:{icon:"📥",label:"Deposit"},
      WITHDRAW:{icon:"💸",label:"Withdraw"},
      TIP:{icon:"💛",label:"Tip"},
      TIP_SENT:{icon:"💛",label:"Tip Sent"},
      TIP_RECEIVED:{icon:"🎁",label:"Tip Received"},
      INTERNAL_REWARD:{icon:"🎉",label:"Reward"}
    };

    box.innerHTML=transactions.map(tx=>{
      const info=typeInfo[tx.type] || {
        icon:"📄",
        label:tx.type || "Transaction"
      };

      const amount=Number(tx.amount || 0);

      const amountText=Number.isFinite(amount)
        ? amount.toLocaleString("en-US",{maximumFractionDigits:4})
        : String(tx.amount || "0");

      const timestamp=Number(tx.timestamp || 0);

      const date=timestamp
        ? new Date(timestamp*1000).toLocaleString("en-GB",{
            timeZone:"Asia/Jakarta",
            day:"2-digit",
            month:"short",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
          })
        : "Unknown time";

      const status=String(tx.status || "Confirmed");
      const txHash=tx.tx_hash ? String(tx.tx_hash) : "";

      const txLink=txHash
        ? `<a href="https://sepolia.etherscan.io/tx/${encodeURIComponent(txHash)}" target="_blank" rel="noopener noreferrer" style="font-size:11px;text-decoration:none;">View Tx ↗</a>`
        : "";

      return `
        <div style="padding:13px 0;border-bottom:1px solid #252b38;">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
            <div style="display:flex;align-items:center;gap:9px;">
              <span style="font-size:20px;">${info.icon}</span>
              <div>
                <div style="font-weight:700;">${info.label}</div>
                <div style="font-size:11px;opacity:.65;">${date} WIB</div>
              </div>
            </div>

            <div style="text-align:right;">
              <div style="font-weight:700;">${amountText} HTP</div>
              <div style="font-size:11px;opacity:.7;">${status}</div>
            </div>
          </div>

          ${txLink
            ? `<div style="margin-top:7px;text-align:right;">${txLink}</div>`
            : ""}
        </div>
      `;
    }).join("");

  }catch(error){
    console.error("Mini App Transaction History API:",error);

    box.innerHTML=`
      <div class="info-desc" style="text-align:center;padding:14px 0;">
        Unable to load transaction history.
      </div>
    `;
  }
}

async function copyWalletAddress(){
  const address=window.happyTipWalletAddress;
  if(!address) return;

  try{
    await navigator.clipboard.writeText(address);
  }catch(e){
    const input=document.createElement("input");
    input.value=address;
    document.body.appendChild(input);
    input.select();
    document.execCommand("copy");
    input.remove();
  }

  if(tg) tg.HapticFeedback?.notificationOccurred("success");
}
